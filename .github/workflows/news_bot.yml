name: ChartBook 24/7 Global & Korea Breaking News Bot

on:
  schedule:
    # 5분마다 자동 실행 (GitHub Actions 무료 스케줄러 최소 단위)
    - cron: '*/5 * * * *'
  workflow_dispatch: # GitHub 웹페이지에서 수동 즉시 실행 버튼 활성화

permissions:
  contents: write # 중복 방지 기록(sent_history.json) 자동 업데이트 권한

concurrency:
  group: chartbook-news-bot
  cancel-in-progress: false

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 2. Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 필수 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 4. 실시간 속보 스캔 및 텔레그램(@chartbooknews) 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@chartbooknews'
        run: |
          git fetch origin main && git reset --hard origin/main
          python chartbook_news_bot_v2.py --once --style 1 --max-age 60
      - name: 5. 발송 이력(sent_history.json) 저장소 자동 백업 (중복 발송 영구 방지)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sent_history.json [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
